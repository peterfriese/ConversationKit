<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #000000; }
      .kicker { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 11px; font-weight: 600; fill: #98989D; letter-spacing: 0.08em; text-anchor: middle; text-transform: uppercase; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; font-size: 22px; font-weight: 700; fill: #F5F5F7; text-anchor: middle; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 13px; font-weight: 400; fill: #98989D; text-anchor: middle; }
      
      .phone-frame { fill: #1C1C1E; stroke: #38383A; stroke-width: 2; }
      .island { fill: #000000; }
      .home-bar { fill: #636366; }
      
      .hero-placeholder { fill: #1C2834; }
      .hero-pill { fill: #2997FF; }
      .list-card { fill: #2C2C2E; }
      .list-icon { fill: #3A3A3C; }
      .list-text-1 { fill: #636366; }
      .list-text-2 { fill: #48484A; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="canvas-bg" />

  <!-- Header Block -->
  <text x="380" y="34" class="kicker">Interactive tutorial • Hero asset</text>
  <text x="380" y="60" class="header-title">Application overview</text>
  <text x="380" y="82" class="header-sub">A clean rendering of the running application interface</text>

  <!-- iPhone Mockup (Dark Mode) -->
  <g id="device-iphone">
    <rect x="270" y="105" width="220" height="360" rx="36" ry="36" class="phone-frame" />
    
    <!-- Dynamic Island -->
    <rect x="345" y="117" width="70" height="18" rx="9" ry="9" class="island" />
    
    <!-- Hero Image Area -->
    <rect x="286" y="146" width="188" height="110" rx="16" ry="16" class="hero-placeholder" />
    <rect x="298" y="230" width="56" height="16" rx="6" ry="6" class="hero-pill" />

    <!-- List Row 1 -->
    <g transform="translate(0, 0)">
      <rect x="286" y="268" width="188" height="38" rx="12" ry="12" class="list-card" />
      <rect x="296" y="275" width="24" height="24" rx="6" ry="6" class="list-icon" />
      <rect x="330" y="279" width="80" height="7" rx="3" ry="3" class="list-text-1" />
      <rect x="330" y="291" width="50" height="6" rx="3" ry="3" class="list-text-2" />
    </g>

    <!-- List Row 2 -->
    <g transform="translate(0, 46)">
      <rect x="286" y="268" width="188" height="38" rx="12" ry="12" class="list-card" />
      <rect x="296" y="275" width="24" height="24" rx="6" ry="6" class="list-icon" />
      <rect x="330" y="279" width="80" height="7" rx="3" ry="3" class="list-text-1" />
      <rect x="330" y="291" width="50" height="6" rx="3" ry="3" class="list-text-2" />
    </g>

    <!-- List Row 3 -->
    <g transform="translate(0, 92)">
      <rect x="286" y="268" width="188" height="38" rx="12" ry="12" class="list-card" />
      <rect x="296" y="275" width="24" height="24" rx="6" ry="6" class="list-icon" />
      <rect x="330" y="279" width="80" height="7" rx="3" ry="3" class="list-text-1" />
      <rect x="330" y="291" width="50" height="6" rx="3" ry="3" class="list-text-2" />
    </g>

    <!-- Home Indicator -->
    <rect x="340" y="452" width="80" height="4" rx="2" ry="2" class="home-bar" />
  </g>
</svg>
