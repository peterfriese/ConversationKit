<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <style>
      .canvas-bg { fill: #FFFFFF; }
      .kicker { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 11px; font-weight: 600; fill: #86868B; letter-spacing: 0.08em; text-anchor: middle; text-transform: uppercase; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; font-size: 22px; font-weight: 700; fill: #1D1D1F; text-anchor: middle; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 13px; font-weight: 400; fill: #86868B; text-anchor: middle; }
      
      .ipad-frame { fill: #FFFFFF; stroke: #E5E5EA; stroke-width: 2; }
      .phone-frame { fill: #FFFFFF; stroke: #E5E5EA; stroke-width: 2; filter: drop-shadow(-10px 16px 28px rgba(0,0,0,0.06)); }
      
      .dot-hero { fill: #0071E3; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 13px; font-weight: 600; fill: #1D1D1F; }
      
      .sync-pill { fill: #EBF4FF; rx: 10; ry: 10; }
      .sync-text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-size: 12px; font-weight: 600; fill: #0071E3; }
      .island { fill: #1D1D1F; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="canvas-bg" />

  <!-- Header Block -->
  <text x="380" y="34" class="kicker">Conceptual guide • Hero asset</text>
  <text x="380" y="60" class="header-title">Synchronized view state</text>
  <text x="380" y="82" class="header-sub">Active state synchronization across iPhone and iPad</text>

  <!-- iPad Frame (Left) -->
  <g id="device-ipad">
    <rect x="180" y="140" width="310" height="240" rx="24" ry="24" class="ipad-frame" />
    <circle cx="214" cy="170" r="5" class="dot-hero" />
    <text x="228" y="174" class="badge-text">Active session</text>
  </g>

  <!-- iPhone Frame (Right, Overlapping) -->
  <g id="device-iphone">
    <rect x="420" y="120" width="180" height="310" rx="32" ry="32" class="phone-frame" />
    
    <!-- Dynamic Island -->
    <rect x="475" y="132" width="55" height="15" rx="7.5" ry="7.5" class="island" />
    
    <!-- Synced Status Pill -->
    <rect x="470" y="165" width="65" height="22" rx="11" ry="11" class="sync-pill" />
    <circle cx="482" cy="176" r="3.5" class="dot-hero" />
    <text x="492" y="180" class="sync-text">Synced</text>
  </g>
</svg>
